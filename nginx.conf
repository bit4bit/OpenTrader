server {
    listen 80;
    server_name _;

    root /dist;
    index index.html;

    # Django REST API (backend's fixed IP, see compose.yml)
    location /api/ {
        proxy_pass http://172.28.0.10:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://172.28.0.10:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite build assets (base=/static/) are inside dist
    location /static/ {
        alias /dist/;
        expires 7d;
    }

    # SPA fallback
    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
