services:
  frontend:
    build: ./frontend
    volumes:
      - dist:/dist

  backend:
    build: .
    expose:
      - "8000"
    environment:
      - OPENTRADER_WORKING_DIR=/data
    volumes:
      - opentrader_data:/data

  router:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - dist:/dist:ro
    depends_on:
      - frontend
      - backend

volumes:
  dist:
  opentrader_data:
